# Meridian Shaders - Iris configuration.
# Pipeline and buffer ownership: docs/ARCHITECTURE.md. Option definitions: lib/settings.glsl.

# ---------------------------------------------------------------- Iris features
iris.features.required = SSBO CUSTOM_IMAGES COMPUTE_SHADERS SEPARATE_HARDWARE_SAMPLERS
iris.features.optional = BLOCK_EMISSION_ATTRIBUTE ENTITY_TRANSLUCENT

# ---------------------------------------------------------------- vanilla features replaced
clouds = off
sun = false
moon = false
stars = false
underwaterOverlay = false
vignette = false
oldLighting = false
oldHandLight = false
separateAo = true
particles.ordering = mixed

# ---------------------------------------------------------------- shadows
shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowBlockEntities = true
#ifdef COLORED_LIGHTING
# Render every chunk near the player into the shadow pass (needed for voxelisation).
shadow.culling = reversed
#endif

# ---------------------------------------------------------------- blending
# G-buffer programs write packed data and must not blend.
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.gbuffers_entities = off
blend.gbuffers_hand = off
blend.gbuffers_textured = off
blend.gbuffers_textured_lit = off
blend.gbuffers_basic = off
blend.gbuffers_beaconbeam = off
blend.gbuffers_spidereyes = off
blend.gbuffers_lightning = off
blend.gbuffers_water = off
blend.gbuffers_hand_water = off
blend.dh_terrain = off
blend.dh_water = off
# Rain/snow layer is premultiplied.
blend.gbuffers_weather = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# ---------------------------------------------------------------- buffers
size.buffer.colortex9 = 0.5 0.5

# Persistent state (exposure, simulation bookkeeping, shadow cascades): lib/common/state.glsl
bufferObject.0 = 1024

# ---------------------------------------------------------------- custom images (16 of 16)
image.transmittanceLut = transmittanceLutSampler RGBA RGBA16F HALF_FLOAT false false 256 64
image.multiScatterLut = multiScatterLutSampler RGBA RGBA16F HALF_FLOAT false false 32 32
image.skyViewLut = skyViewLutSampler RGBA RGBA16F HALF_FLOAT false false 256 128
image.cloudShadow = cloudShadowSampler RED R16F HALF_FLOAT false false 256 256
image.aoGiImg = aoGiSampler RGBA RGBA16F HALF_FLOAT false true 0.5 0.5
image.vlImg = vlSampler RGBA RGBA16F HALF_FLOAT false true 0.5 0.5

#if CLOUD_RES == 1
image.cloudMarch = cloudMarchSampler RGBA RGBA16F HALF_FLOAT false true 1.0 1.0
image.cloudDist = cloudDistSampler RED R32F FLOAT false true 1.0 1.0
image.cloudHistA = cloudHistSamplerA RGBA RGBA16F HALF_FLOAT false true 1.0 1.0
image.cloudHistB = cloudHistSamplerB RGBA RGBA16F HALF_FLOAT false true 1.0 1.0
#elif CLOUD_RES == 2
image.cloudMarch = cloudMarchSampler RGBA RGBA16F HALF_FLOAT false true 0.5 0.5
image.cloudDist = cloudDistSampler RED R32F FLOAT false true 0.5 0.5
image.cloudHistA = cloudHistSamplerA RGBA RGBA16F HALF_FLOAT false true 0.5 0.5
image.cloudHistB = cloudHistSamplerB RGBA RGBA16F HALF_FLOAT false true 0.5 0.5
#else
image.cloudMarch = cloudMarchSampler RGBA RGBA16F HALF_FLOAT false true 0.25 0.25
image.cloudDist = cloudDistSampler RED R32F FLOAT false true 0.25 0.25
image.cloudHistA = cloudHistSamplerA RGBA RGBA16F HALF_FLOAT false true 0.25 0.25
image.cloudHistB = cloudHistSamplerB RGBA RGBA16F HALF_FLOAT false true 0.25 0.25
#endif

#if WATER_SIM_RES == 0
image.waterSimA = waterSimSamplerA RG RG16F HALF_FLOAT false false 128 128
image.waterSimB = waterSimSamplerB RG RG16F HALF_FLOAT false false 128 128
#elif WATER_SIM_RES == 1
image.waterSimA = waterSimSamplerA RG RG16F HALF_FLOAT false false 256 256
image.waterSimB = waterSimSamplerB RG RG16F HALF_FLOAT false false 256 256
#else
image.waterSimA = waterSimSamplerA RG RG16F HALF_FLOAT false false 512 512
image.waterSimB = waterSimSamplerB RG RG16F HALF_FLOAT false false 512 512
#endif

# Coloured-light voxel volume (cleared every frame) and the two flood-fill volumes.
#if CL_VOLUME == 0
image.voxelImg = voxelSampler RED_INTEGER R16UI UNSIGNED_SHORT true false 128 64 128
image.lightImgA = lightSamplerA RGBA RGBA8 UNSIGNED_BYTE false false 128 64 128
image.lightImgB = lightSamplerB RGBA RGBA8 UNSIGNED_BYTE false false 128 64 128
#elif CL_VOLUME == 1
image.voxelImg = voxelSampler RED_INTEGER R16UI UNSIGNED_SHORT true false 192 96 192
image.lightImgA = lightSamplerA RGBA RGBA8 UNSIGNED_BYTE false false 192 96 192
image.lightImgB = lightSamplerB RGBA RGBA8 UNSIGNED_BYTE false false 192 96 192
#else
image.voxelImg = voxelSampler RED_INTEGER R16UI UNSIGNED_SHORT true false 256 128 256
image.lightImgA = lightSamplerA RGBA RGBA8 UNSIGNED_BYTE false false 256 128 256
image.lightImgB = lightSamplerB RGBA RGBA8 UNSIGNED_BYTE false false 256 128 256
#endif

# ---------------------------------------------------------------- custom textures
customTexture.cloudShapeTex = textures/clouds/cloud_shape.bin TEXTURE_3D RGBA8 128 128 128 RGBA UNSIGNED_BYTE
customTexture.cloudDetailTex = textures/clouds/cloud_detail.bin TEXTURE_3D RGBA8 32 32 32 RGBA UNSIGNED_BYTE
customTexture.noise2dTex = textures/noise2d.png
customTexture.dfgLut = textures/dfg.bin TEXTURE_2D RG16F 32 32 RG HALF_FLOAT
customTexture.starCells = textures/stars/star_cells.bin TEXTURE_2D RG16UI 256 256 RG_INTEGER UNSIGNED_SHORT
customTexture.starData = textures/stars/star_data.bin TEXTURE_2D RGBA32F 1024 128 RGBA FLOAT
customTexture.milkyWay = textures/stars/milkyway.png
#if MOON_TEXTURE == 0
customTexture.moonAlbedo = textures/moon/moon_albedo_2k.png
customTexture.moonNormal = textures/moon/moon_normal_2k.png
#elif MOON_TEXTURE == 1
customTexture.moonAlbedo = textures/moon/moon_albedo_4k.png
customTexture.moonNormal = textures/moon/moon_normal_4k.png
#else
customTexture.moonAlbedo = textures/moon/moon_albedo_8k.png
customTexture.moonNormal = textures/moon/moon_normal_8k.png
#endif

# ---------------------------------------------------------------- custom uniforms
uniform.float.frameTimeSmooth = smooth(frameTime, 1.0, 1.0)
uniform.float.rainSmooth = smooth(rainStrength, 40.0, 40.0)
uniform.float.thunderSmooth = smooth(thunderStrength, 40.0, 40.0)
uniform.float.eyeSkylightSmooth = smooth(eyeBrightnessSmooth.y / 240.0, 20.0, 20.0)
uniform.float.caveFactor = smooth(clamp((62.0 - eyeAltitude) / 32.0, 0.0, 1.0) * (1.0 - eyeBrightnessSmooth.y / 240.0), 40.0, 40.0)
uniform.float.biomeWet = smooth(if(biome_precipitation == PPT_RAIN, 1.0, 0.0), 60.0, 60.0)
uniform.float.biomeSnowy = smooth(if(biome_precipitation == PPT_SNOW, 1.0, 0.0), 60.0, 60.0)
uniform.float.biomeOcean = smooth(if(biome_category == CAT_OCEAN, 1.0, 0.0), 120.0, 120.0)
uniform.float.biomeRiver = smooth(if(biome_category == CAT_RIVER, 1.0, 0.0), 120.0, 120.0)
uniform.float.biomeSwamp = smooth(if(biome_category == CAT_SWAMP, 1.0, 0.0), 120.0, 120.0)

# ---------------------------------------------------------------- program switches
# Whole passes that an option turns off cost nothing (compute passes that share a stage with
# other work return early instead).
program.world0/composite4.enabled = BLOOM
program.world-1/composite4.enabled = BLOOM
program.world1/composite4.enabled = BLOOM

# ---------------------------------------------------------------- settings menu
screen = <profile> <empty> [GENERAL] [GRAPHICS] [LIGHTING] [ATMOSPHERE_WEATHER] [WATER_REFLECTIONS]  [MATERIALS] [CELESTIAL] [DIMENSIONS] [PERFORMANCE] [ADVANCED]
screen.columns = 2

# ---- top level
screen.GENERAL = COLOR_PROFILE TONEMAP EXPOSURE_BIAS AUTO_EXPOSURE NIGHT_BRIGHTNESS ADAPTATION_SPEED
screen.GRAPHICS = TAA TAA_SHARPNESS BLOOM BLOOM_STRENGTH VIGNETTE PURKINJE <empty> <empty> [GRADING]
screen.LIGHTING = SUN_BRIGHTNESS MOON_BRIGHTNESS SKY_LIGHT_STRENGTH BLOCKLIGHT_STRENGTH BLOCKLIGHT_TEMPERATURE  CAVE_MIN_LIGHT HAND_LIGHT <empty> AMBIENT_OCCLUSION AO_STRENGTH <empty> <empty> [SHADOWS] [GLOBAL_ILLUMINATION]
screen.ATMOSPHERE_WEATHER = [CLOUDS] [ATMOSPHERE] [WEATHER] [RAIN] [PUDDLES] <empty> AURORA AURORA_BRIGHTNESS
screen.WATER_REFLECTIONS = [WATER] [WATER_SIM] [REFLECTIONS]
screen.MATERIALS = HARDCODED_MATERIALS SUBSURFACE_SCATTERING EMISSION_STRENGTH EMISSIVE_ORES <empty> [LABPBR]
screen.CELESTIAL = [MOON] [STARS]
screen.DIMENSIONS = [END] [BLACK_HOLE] [NETHER]
# Resolution and step counts of every expensive pass in one place (the quality profiles set these).
screen.PERFORMANCE = shadowMapResolution shadowDistance SHADOW_SAMPLES CLOUD_QUALITY CLOUD_RES VL_STEPS SSR_STEPS  POM_SAMPLES CL_VOLUME CL_ITERATIONS RSM_SAMPLES WATER_SIM_RES BH_LENSING_STEPS
screen.ADVANCED = DEBUG_VIEW <empty> BORDER_FOG LOD_FADE

# ---- submenus
screen.GRADING = CUSTOM_SATURATION CUSTOM_VIBRANCE CUSTOM_CONTRAST CUSTOM_WHITE_BALANCE CUSTOM_SHADOW_TINT
screen.SHADOWS = SHADOW_FILTER SHADOW_SOFTNESS CONTACT_SHADOWS COLORED_SHADOWS CLOUD_SHADOWS
screen.GLOBAL_ILLUMINATION = COLORED_LIGHTING CL_BRIGHTNESS INDIRECT_SUN INDIRECT_SUN_STRENGTH
screen.CLOUDS = VOLUMETRIC_CLOUDS CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_SPEED CIRRUS_CLOUDS CIRRUS_AMOUNT
screen.ATMOSPHERE = HAZE_DENSITY AERIAL_PERSPECTIVE VOLUMETRIC_LIGHT VL_STRENGTH
screen.WEATHER = WET_SURFACES LIGHTNING_FLASH RAINBOWS RAINBOW_STRENGTH SNOW_OVERLAY SNOW_AMOUNT
screen.RAIN = RAIN_STREAKS RAIN_OPACITY RAIN_WIND_LEAN RAIN_RIPPLES
screen.PUDDLES = PUDDLES PUDDLE_AMOUNT PUDDLE_SIZE
screen.WATER = WATER_WAVES WAVE_HEIGHT WAVE_SPEED WATER_REFRACTION WATER_CLARITY WATER_CAUSTICS WATER_VANILLA_TEXTURE
screen.WATER_SIM = WATER_SIM WATER_SIM_STRENGTH
screen.REFLECTIONS = SSR SSR_MAX_ROUGHNESS SKY_REFLECTIONS
screen.LABPBR = PBR_MODE NORMAL_MAPPING NORMAL_MAP_STRENGTH NORMAL_MAP_Y_FLIP PARALLAX_OCCLUSION POM_DEPTH  POM_SELF_SHADOW
screen.MOON = MOON_TEXTURE MOON_SIZE SUN_SIZE ECLIPSES EARTHSHINE
screen.STARS = STARS STAR_BRIGHTNESS MILKY_WAY MILKY_WAY_BRIGHTNESS
screen.END = END_SPACE END_NEBULAE END_PLANETS END_LIGHT_STRENGTH
screen.BLACK_HOLE = BLACK_HOLE BH_SIZE BH_DISK_BRIGHTNESS
screen.NETHER = NETHER_FOG_DENSITY NETHER_SMOKE HEAT_DISTORTION HEAT_STRENGTH NETHER_ASH

sliders = EXPOSURE_BIAS NIGHT_BRIGHTNESS ADAPTATION_SPEED SUN_BRIGHTNESS MOON_BRIGHTNESS SKY_LIGHT_STRENGTH \
 BLOCKLIGHT_STRENGTH BLOCKLIGHT_TEMPERATURE CAVE_MIN_LIGHT AO_STRENGTH shadowMapResolution shadowDistance \
 SHADOW_SAMPLES SHADOW_SOFTNESS NORMAL_MAP_STRENGTH POM_DEPTH POM_SAMPLES EMISSION_STRENGTH EMISSIVE_ORES SSR_STEPS \
 SSR_MAX_ROUGHNESS CL_BRIGHTNESS RSM_SAMPLES INDIRECT_SUN_STRENGTH WAVE_HEIGHT WAVE_SPEED WATER_CLARITY \
 WATER_SIM_STRENGTH CLOUD_COVERAGE CLOUD_ALTITUDE CLOUD_SPEED CIRRUS_AMOUNT HAZE_DENSITY AERIAL_PERSPECTIVE \
 VL_STEPS VL_STRENGTH RAIN_OPACITY RAIN_WIND_LEAN RAINBOW_STRENGTH AURORA_BRIGHTNESS SNOW_AMOUNT PUDDLE_AMOUNT PUDDLE_SIZE MOON_SIZE SUN_SIZE STAR_BRIGHTNESS \
 MILKY_WAY_BRIGHTNESS BH_SIZE BH_DISK_BRIGHTNESS BH_LENSING_STEPS END_LIGHT_STRENGTH NETHER_FOG_DENSITY \
 HEAT_STRENGTH BLOOM_STRENGTH VIGNETTE CUSTOM_SATURATION CUSTOM_VIBRANCE CUSTOM_CONTRAST CUSTOM_WHITE_BALANCE \
 CUSTOM_SHADOW_TINT LOD_FADE TAA_SHARPNESS DEBUG_VIEW

# ---------------------------------------------------------------- quality profiles
profile.LOW = shadowMapResolution=2048 shadowDistance=128.0 SHADOW_FILTER=1 SHADOW_SAMPLES=8 !CONTACT_SHADOWS \
 CL_VOLUME=0 CL_ITERATIONS=1 !INDIRECT_SUN RSM_SAMPLES=6 CLOUD_QUALITY=0 CLOUD_RES=4 !VOLUMETRIC_LIGHT VL_STEPS=6 \
 SSR_STEPS=12 SSR_MAX_ROUGHNESS=0.3 !PARALLAX_OCCLUSION POM_SAMPLES=16 WATER_SIM_RES=0 BH_LENSING_STEPS=24 MOON_TEXTURE=0
profile.MEDIUM = shadowMapResolution=3072 shadowDistance=160.0 SHADOW_FILTER=2 SHADOW_SAMPLES=8 CONTACT_SHADOWS \
 CL_VOLUME=0 CL_ITERATIONS=1 !INDIRECT_SUN RSM_SAMPLES=8 CLOUD_QUALITY=1 CLOUD_RES=2 VOLUMETRIC_LIGHT VL_STEPS=8 \
 SSR_STEPS=16 SSR_MAX_ROUGHNESS=0.4 PARALLAX_OCCLUSION POM_SAMPLES=16 WATER_SIM_RES=1 BH_LENSING_STEPS=32 MOON_TEXTURE=1
profile.HIGH = shadowMapResolution=4096 shadowDistance=160.0 SHADOW_FILTER=2 SHADOW_SAMPLES=12 CONTACT_SHADOWS \
 CL_VOLUME=1 CL_ITERATIONS=2 INDIRECT_SUN RSM_SAMPLES=12 CLOUD_QUALITY=2 CLOUD_RES=2 VOLUMETRIC_LIGHT VL_STEPS=12 \
 SSR_STEPS=24 SSR_MAX_ROUGHNESS=0.55 PARALLAX_OCCLUSION POM_SAMPLES=32 WATER_SIM_RES=1 BH_LENSING_STEPS=48 MOON_TEXTURE=1
profile.ULTRA = shadowMapResolution=6144 shadowDistance=224.0 SHADOW_FILTER=2 SHADOW_SAMPLES=16 CONTACT_SHADOWS \
 CL_VOLUME=2 CL_ITERATIONS=3 INDIRECT_SUN RSM_SAMPLES=16 CLOUD_QUALITY=3 CLOUD_RES=2 VOLUMETRIC_LIGHT VL_STEPS=16 \
 SSR_STEPS=32 SSR_MAX_ROUGHNESS=0.7 PARALLAX_OCCLUSION POM_SAMPLES=48 WATER_SIM_RES=2 BH_LENSING_STEPS=64 MOON_TEXTURE=2
profile.CINEMATIC = shadowMapResolution=8192 shadowDistance=256.0 SHADOW_FILTER=2 SHADOW_SAMPLES=24 CONTACT_SHADOWS \
 CL_VOLUME=2 CL_ITERATIONS=4 INDIRECT_SUN RSM_SAMPLES=24 CLOUD_QUALITY=3 CLOUD_RES=1 VOLUMETRIC_LIGHT VL_STEPS=24 \
 SSR_STEPS=48 SSR_MAX_ROUGHNESS=0.85 PARALLAX_OCCLUSION POM_SAMPLES=64 WATER_SIM_RES=2 BH_LENSING_STEPS=96 MOON_TEXTURE=2
