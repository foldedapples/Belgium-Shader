# Belgium Shaders - pipeline directives (Iris). See docs/ORIGINAL_ARCHITECTURE.md.

# ---------------------------------------------------------------- vanilla replacements ----
clouds = off
sun = false
moon = false
stars = false
underwaterOverlay = false
vignette = false
separateAo = true
oldLighting = false
oldHandLight = false
# Held light is coloured and computed by the pack (lib/lighting/hand_light.glsl).
dynamicHandLight = false
voxelizeLightBlocks = true
rain.depth = false

# Core architecture (FrameState SSBO, compute LUTs and simulation, custom images) needs these.
iris.features.required = SSBO COMPUTE_SHADERS CUSTOM_IMAGES SEPARATE_HARDWARE_SAMPLERS
# Optional: Iris defines IRIS_FEATURE_<NAME> when present; the pack falls back otherwise.
iris.features.optional = BLOCK_EMISSION_ATTRIBUTE

# ---------------------------------------------------------------- shadows -----------------
# Our shadow pass uses its own light matrix (FrameState); Iris must not cull with its own.
shadow.culling = false
shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowPlayer = true
shadowBlockEntities = true

# ---------------------------------------------------------------- storage -----------------
# FrameState (lib/core/frame_state.glsl): 32 vec4 + 2 mat4, rounded up.
bufferObject.0 = 1024
# WaterSimState (lib/water/water_sim_common.glsl): 15 vec4.
bufferObject.1 = 256

image.transmittanceLut = transmittanceLutTex RGBA RGBA16F HALF_FLOAT false false 256 64
image.multiScatterLut = multiScatterLutTex RGBA RGBA16F HALF_FLOAT false false 32 32
image.dfgLut = dfgLutTex RG RG16F HALF_FLOAT false false 64 64
image.skyViewLut = skyViewLutTex RGBA RGBA16F HALF_FLOAT false false 192 216

#ifdef WATER_SIMULATION
#if WATER_SIM_RES == 256
image.waterSimA = waterSimATex RGBA RGBA16F HALF_FLOAT false false 256 256
image.waterSimB = waterSimBTex RGBA RGBA16F HALF_FLOAT false false 256 256
#elif WATER_SIM_RES == 1024
image.waterSimA = waterSimATex RGBA RGBA16F HALF_FLOAT false false 1024 1024
image.waterSimB = waterSimBTex RGBA RGBA16F HALF_FLOAT false false 1024 1024
#elif WATER_SIM_RES == 2048
image.waterSimA = waterSimATex RGBA RGBA16F HALF_FLOAT false false 2048 2048
image.waterSimB = waterSimBTex RGBA RGBA16F HALF_FLOAT false false 2048 2048
#else
image.waterSimA = waterSimATex RGBA RGBA16F HALF_FLOAT false false 512 512
image.waterSimB = waterSimBTex RGBA RGBA16F HALF_FLOAT false false 512 512
#endif
#endif

#ifdef VOLUMETRIC_CLOUDS
#if CLOUD_SHADOW_RES == 256
image.cloudShadowMap = cloudShadowTex RED R16F HALF_FLOAT false false 256 256
#elif CLOUD_SHADOW_RES == 1024
image.cloudShadowMap = cloudShadowTex RED R16F HALF_FLOAT false false 1024 1024
#else
image.cloudShadowMap = cloudShadowTex RED R16F HALF_FLOAT false false 512 512
#endif
#endif
customTexture.cloudShapeTex = textures/cloud_shape.bin TEXTURE_3D RGBA8 128 128 128 RGBA UNSIGNED_BYTE
customTexture.cloudDetailTex = textures/cloud_detail.bin TEXTURE_3D RGBA8 32 32 32 RGBA UNSIGNED_BYTE
#ifdef BLOOM
image.bloomAtlas = bloomAtlasTex RGBA RGBA16F HALF_FLOAT false true 0.75 0.5
#endif
customTexture.blueNoiseTex = textures/bluenoise.png
image.blackHoleLut = blackHoleLutTex RGBA RGBA32F FLOAT false false 512 256
#ifdef COLORED_LIGHTING
image.voxelMap = none RED_INTEGER R32UI UNSIGNED_INT true false 128 64 128
image.lightVolA = lightVolATex RGBA RGBA16F HALF_FLOAT false false 128 64 128
image.lightVolB = lightVolBTex RGBA RGBA16F HALF_FLOAT false false 128 64 128
#endif
customTexture.noise2dTex = textures/noise2d.png
customTexture.beMilkyWayTex = textures/milkyway.png
# Halcyon sky (lib/halcyon): Halcyon's NASA moon and Milky Way, Hipparcos/Yale catalogue,
# and our own Perlin texture standing in for Glimmer's (tools/gen_noise.py).
customTexture.perlinNoiseTex = textures/perlin2d.png
#if MOON_TEXTURE_RES == 4096
customTexture.moonTex = textures/halcyon/moon_4k.png
#else
customTexture.moonTex = textures/halcyon/moon_2k.png
#endif
#if MILKY_WAY_TEXTURE_RES == 4096
customTexture.milkyWayTex = textures/halcyon/milkyway_4k.png
#else
customTexture.milkyWayTex = textures/halcyon/milkyway_8k.png
#endif
customTexture.starCatalogTex = textures/halcyon/starCatalog.bin TEXTURE_2D RGBA32F 1024 260 RGBA FLOAT
#if MOON_TEXTURE == 1
customTexture.moonAlbedoTex = textures/moon_albedo_2k.png
customTexture.moonNormalTex = textures/moon_normal_2k.png
#elif MOON_TEXTURE == 2
customTexture.moonAlbedoTex = textures/moon_albedo_4k.png
customTexture.moonNormalTex = textures/moon_normal_4k.png
#elif MOON_TEXTURE == 3
customTexture.moonAlbedoTex = textures/moon_albedo_8k.png
customTexture.moonNormalTex = textures/moon_normal_4k.png
#endif

# ---------------------------------------------------------------- custom uniforms ---------
uniform.vec2.viewSize = vec2(viewWidth, viewHeight)
uniform.vec2.texelSize = vec2(1.0 / viewWidth, 1.0 / viewHeight)
uniform.float.biomeOceanSmooth = smooth(if(biome_category == CAT_OCEAN, 1.0, 0.0), 8.0, 8.0)
uniform.float.biomeRiverSmooth = smooth(if(biome_category == CAT_RIVER, 1.0, 0.0), 8.0, 8.0)
uniform.float.biomePrecipSmooth = smooth(if(biome_precipitation == PPT_RAIN, 1.0, 0.0), 6.0, 6.0)
uniform.float.biomeSnowSmooth = smooth(if(biome_precipitation == PPT_SNOW, 1.0, 0.0), 6.0, 6.0)
# Halcyon's surfaceWetness (renamed hc_surfaceWetness: Belgium has a function of that name).
uniform.float.hc_surfaceWetness = smooth(rainStrength * if(biome_precipitation == PPT_RAIN, 1.0, 0.0), 20, 60)

# ---------------------------------------------------------------- optional programs ------
program.world0/deferred.enabled = VOLUMETRIC_CLOUDS
program.world0/shadowcomp.enabled = COLORED_LIGHTING
program.world1/shadowcomp.enabled = COLORED_LIGHTING
program.world-1/shadowcomp.enabled = COLORED_LIGHTING
program.world-1/shadow.enabled = COLORED_LIGHTING
program.world0/composite1.enabled = VOLUMETRIC_LIGHT
program.world1/composite1.enabled = VOLUMETRIC_LIGHT
program.world-1/composite1.enabled = false
scale.composite1 = 0.5
scale.deferred2 = 0.5
scale.deferred3 = 0.5
program.world0/deferred2.enabled = SSGI
program.world0/deferred3.enabled = SSGI
program.world1/deferred2.enabled = SSGI
program.world1/deferred3.enabled = SSGI
program.world-1/deferred2.enabled = SSGI
program.world-1/deferred3.enabled = SSGI
program.world0/dh_shadow.enabled = LOD_SHADOWS
program.world1/dh_shadow.enabled = LOD_SHADOWS
#ifdef LOD_SHADOWS
dhShadow.enabled = true
#else
dhShadow.enabled = false
#endif
program.world0/composite4.enabled = DOF
program.world1/composite4.enabled = DOF
program.world-1/composite4.enabled = DOF
program.world0/composite5.enabled = MOTION_BLUR
program.world0/composite7.enabled = BLOOM
program.world0/composite8.enabled = BLOOM
program.world0/composite9.enabled = BLOOM
program.world0/composite10.enabled = BLOOM
program.world0/composite11.enabled = BLOOM
program.world0/composite12.enabled = BLOOM
program.world0/composite13.enabled = BLOOM
program.world0/composite14.enabled = BLOOM
program.world0/composite15.enabled = BLOOM
program.world1/composite7.enabled = BLOOM
program.world1/composite8.enabled = BLOOM
program.world1/composite9.enabled = BLOOM
program.world1/composite10.enabled = BLOOM
program.world1/composite11.enabled = BLOOM
program.world1/composite12.enabled = BLOOM
program.world1/composite13.enabled = BLOOM
program.world1/composite14.enabled = BLOOM
program.world1/composite15.enabled = BLOOM
program.world-1/composite7.enabled = BLOOM
program.world-1/composite8.enabled = BLOOM
program.world-1/composite9.enabled = BLOOM
program.world-1/composite10.enabled = BLOOM
program.world-1/composite11.enabled = BLOOM
program.world-1/composite12.enabled = BLOOM
program.world-1/composite13.enabled = BLOOM
program.world-1/composite14.enabled = BLOOM
program.world-1/composite15.enabled = BLOOM
program.world1/composite5.enabled = MOTION_BLUR
program.world-1/composite5.enabled = MOTION_BLUR
program.world0/deferred1.enabled = VOLUMETRIC_CLOUDS
program.world0/prepare.enabled = VOLUMETRIC_CLOUDS && CLOUD_SHADOWS
#if CLOUD_RES == 1.0
scale.deferred = 1.0
#elif CLOUD_RES == 0.75
scale.deferred = 0.75
#elif CLOUD_RES == 0.25
scale.deferred = 0.25
#else
scale.deferred = 0.5
#endif
program.world0/begin_b.enabled = WATER_SIMULATION
program.world0/begin_c.enabled = WATER_SIMULATION
program.world0/begin_d.enabled = WATER_SIMULATION
program.world0/begin_e.enabled = WATER_SIMULATION
program.world1/begin_a.enabled = WATER_SIMULATION
program.world1/begin_b.enabled = WATER_SIMULATION
program.world1/begin_c.enabled = WATER_SIMULATION
program.world1/begin_d.enabled = WATER_SIMULATION

# ---------------------------------------------------------------- blending ----------------
# Opaque G-buffer writers never blend.
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.gbuffers_entities = off
blend.gbuffers_hand = off
blend.gbuffers_textured_lit = off
blend.gbuffers_basic = off
blend.gbuffers_damagedblock = off
blend.dh_terrain = off
blend.dh_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.shadow = off
# Translucent layer: straight colour in, premultiplied accumulation + coverage out.
blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_line = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# Additive emissive overlays.
blend.gbuffers_armor_glint = ONE ONE ONE ONE
blend.gbuffers_spidereyes = ONE ONE ONE ONE
blend.gbuffers_beaconbeam = ONE ONE ONE ONE
blend.gbuffers_lightning = ONE ONE ONE ONE

# ---------------------------------------------------------------- quality presets --------
profile.LOW = shadowMapResolution=1024 shadowDistance=96.0 SHADOW_FILTER=1 !CONTACT_SHADOWS !SSAO SSAO_SAMPLES=4 !COLORED_LIGHTING CLOUD_QUALITY=0 CLOUD_RES=0.25 CLOUD_SHADOW_RES=256 WATER_SIM_RES=256 WATER_SIM_CPB=4 WATER_WAVE_COUNT=8 SSR_STEPS=12 !OPAQUE_SSR !VOLUMETRIC_LIGHT VL_STEPS=8 AURORA_STEPS=12 BH_QUALITY=0 MOON_TEXTURE=1 !SSGI SSGI_RAYS=1 SSGI_STEPS=8 !BLOCK_LIGHT_SPECULAR
profile.MEDIUM = shadowMapResolution=2048 shadowDistance=128.0 SHADOW_FILTER=2 !CONTACT_SHADOWS SSAO SSAO_SAMPLES=6 COLORED_LIGHTING CLOUD_QUALITY=1 CLOUD_RES=0.5 CLOUD_SHADOW_RES=512 WATER_SIM_RES=512 WATER_SIM_CPB=6 WATER_WAVE_COUNT=12 SSR_STEPS=16 OPAQUE_SSR VOLUMETRIC_LIGHT VL_STEPS=12 AURORA_STEPS=16 BH_QUALITY=0 MOON_TEXTURE=2 SSGI SSGI_RAYS=1 SSGI_STEPS=8 BLOCK_LIGHT_SPECULAR
profile.HIGH = shadowMapResolution=3072 shadowDistance=160.0 SHADOW_FILTER=3 CONTACT_SHADOWS SSAO SSAO_SAMPLES=8 COLORED_LIGHTING CLOUD_QUALITY=2 CLOUD_RES=0.5 CLOUD_SHADOW_RES=512 WATER_SIM_RES=512 WATER_SIM_CPB=8 WATER_WAVE_COUNT=16 SSR_STEPS=24 OPAQUE_SSR VOLUMETRIC_LIGHT VL_STEPS=16 AURORA_STEPS=24 BH_QUALITY=1 MOON_TEXTURE=2 SSGI SSGI_RAYS=1 SSGI_STEPS=12 BLOCK_LIGHT_SPECULAR
profile.ULTRA = shadowMapResolution=4096 shadowDistance=192.0 SHADOW_FILTER=4 CONTACT_SHADOWS SSAO SSAO_SAMPLES=12 COLORED_LIGHTING CLOUD_QUALITY=3 CLOUD_RES=0.75 CLOUD_SHADOW_RES=1024 WATER_SIM_RES=1024 WATER_SIM_CPB=8 WATER_WAVE_COUNT=24 SSR_STEPS=48 OPAQUE_SSR VOLUMETRIC_LIGHT VL_STEPS=24 AURORA_STEPS=32 BH_QUALITY=1 MOON_TEXTURE=2 SSGI SSGI_RAYS=2 SSGI_STEPS=16 BLOCK_LIGHT_SPECULAR
profile.CINEMATIC = shadowMapResolution=8192 shadowDistance=256.0 SHADOW_FILTER=4 CONTACT_SHADOWS SSAO SSAO_SAMPLES=16 COLORED_LIGHTING CLOUD_QUALITY=4 CLOUD_RES=1.0 CLOUD_SHADOW_RES=1024 WATER_SIM_RES=2048 WATER_SIM_CPB=12 WATER_WAVE_COUNT=32 SSR_STEPS=64 OPAQUE_SSR VOLUMETRIC_LIGHT VL_STEPS=32 AURORA_STEPS=48 BH_QUALITY=2 MOON_TEXTURE=3 SSGI SSGI_RAYS=4 SSGI_STEPS=24 BLOCK_LIGHT_SPECULAR

