screen.GI = COLORED_LIGHTING HAND_LIGHT BLOCK_LIGHT_SPECULAR <empty> SSGI SSGI_STRENGTH SSGI_RAYS SSGI_STEPS SSGI_RADIUS SSGI_TEMPORAL <empty> <empty> SSAO SSAO_SAMPLES SSAO_STRENGTH CONTACT_SHADOWS
